title: rwth-report
author: Adapted from the GIM thesis template
version: "1.0.0"
quarto-required: ">=1.5"
contributes:
  formats:
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      bibliographystyle: apa
      # --- defaults (override any of these in the .qmd YAML) ---
      titlepage: true          # separate cover page with the RWTH logo
      line_spacing: single     # "single" or "onehalf" (course allows either)
      report_logo: img/rwth-logo.svg  # set to "none" to drop the logo
      color_links: true
      number-sections: true
      fig-cap-location: bottom
      tbl-cap-location: top
      cite-method: citeproc
